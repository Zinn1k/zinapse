name: Build Android APK & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        env:
          BUILD_TYPE: ${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/v') && 'release' || 'debug') }}
        run: |
          cd android
          chmod +x ./gradlew
          
          mkdir -p ../output_apk
          
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "Building Release and Debug APKs..."
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
            cd ..
            find android/app/build/outputs/apk/release -name "*.apk" -exec cp {} output_apk/zinapse-release-unsigned.apk \; || true
            find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} output_apk/zinapse-debug.apk \; || true
            cp output_apk/zinapse-debug.apk ./zinapse-debug.apk || true
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
            find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} output_apk/zinapse-debug.apk \; || true
            cp output_apk/zinapse-debug.apk ./zinapse-debug.apk || true
          fi
          
          echo "Generated APK files in output_apk/:"
          ls -lh output_apk/ || true

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zinapse-android-apk
          path: |
            zinapse-debug.apk
            output_apk/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zinapse-debug.apk
            output_apk/*.apk
          name: Zinapse ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
